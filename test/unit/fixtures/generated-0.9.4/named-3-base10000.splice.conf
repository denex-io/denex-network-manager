_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = {
      serverName = ${?DB_SERVER}
      portNumber = 5432
      databaseName = validator
      currentSchema = validator
      user = ${?DB_USER}
      password = ${?DB_PASSWORD}
      tcpKeepAlive = true
    }
  }
  # Each Splice app opens max-connections Postgres connections. 8 matches Splice's own
  # integration tests and the Canton side (hocon.ts).
  parameters {
    max-connections = 8
    migrate-and-start = true
  }
}

# Scan and the SV app limit each client IP to 10 requests/s by default, keyed on X-Forwarded-For /
# X-Real-IP (client-ip-headers, Splice 0.7.5 and later; 0.7.4 keys the limiter through other
# settings, so these releases still limit). dnm's nginx sets X-Real-IP, so every browser and app request
# through it shares one bucket and gets 429s. An empty header list turns the per-IP limit off;
# the 200 requests/s global limit stays. default and rate-limiters repeat the defaults because
# Splice 0.6.6 requires them whenever rate-limiting is set; 0.6.6 ignores client-ip-headers.
_rate_limiting {
  default { enabled = true, rate-per-second = 200 }
  rate-limiters {}
  client-ip-headers = []
}

_validator_backend {
  latest-packages-only = true
  # Canton >= 3.5 onboards external parties with their keys in the party-to-participant mapping.
  # Without this, the validator does not treat those parties as external and runs no wallet
  # automation for them. Default false in Splice 0.9.x, true from 0.10.0; Splice 0.6.6 lacks the
  # setting and ignores it.
  support-embedded-party-signing-keys = true
  storage = ${_storage}
  admin-api = {
    address = "0.0.0.0"
    port = 5003
  }
  participant-client = {
    admin-api {
      address = canton
      port = 5002
    }
    ledger-api.client-config = {
      address = canton
      port = 5001
    }
  }
  scan-client {
    type = "bft"
    seed-urls = []
  }
  app-instances {}
  domains.global.alias = "global"
  contact-point = ""
  canton-identifier-config.participant = participant
}

canton.features.enable-testing-commands = yes

_sv_participant_client {
  admin-api {
    address = canton
    port = 10002
  }
  ledger-api {
    client-config {
      address = canton
      port = 10001
    }
    auth-config {
      type = "client-credentials"
      well-known-config-url = "http://keycloak:8080/realms/SV/.well-known/openid-configuration"
      client-id = "sv-validator"
      client-secret = "sv-validator-secret"
      audience = "https://canton.network.global"
    }
  }
}

_sv_auth = {
  algorithm = "rs-256"
  audience = "https://canton.network.global"
  jwks-url = "http://keycloak:8080/realms/SV/protocol/openid-connect/certs"
}

_splice-instance-names {
  network-name = "LocalNet"
  network-favicon-url = "https://www.hyperledger.org/hubfs/hyperledgerfavicon.png"
  amulet-name = "Amulet"
  amulet-name-acronym = "AMT"
  name-service-name = "Amulet Name Service"
  name-service-name-acronym = "ANS"
}

canton {
  validator-apps.sv-validator_backend = ${_validator_backend} {
    canton-identifier-config.participant = sv
    onboarding = null
    scan-client = null
    scan-client = {
      type = "trust-single"
      url = "http://localhost:10012"
    }
    sv-user = "service-account-sv-validator"
    sv-validator = true
    storage.config.properties.databaseName = "validator-sv"
    admin-api.port = 10003
    participant-client = ${_sv_participant_client}
    auth = ${_sv_auth}
    ledger-api-user = "service-account-sv-validator"
    validator-wallet-users = ["sv"]
  }

  scan-apps.scan-app {
    is-first-sv = true
    parameters.rate-limiting = ${_rate_limiting}
    storage = ${_storage} {
      config.properties {
        databaseName = scan
        currentSchema = scan
      }
    }

    admin-api = {
      address = "0.0.0.0"
      port = 10012
    }
    participant-client = ${_sv_participant_client}
    synchronizer-nodes {
      current {
        sequencer = {
          address = canton
          port = 10009
        }
        mediator = {
          address = canton
          port = 10007
        }
      }
    }
    sv-user = "service-account-sv-validator"
    splice-instance-names = ${_splice-instance-names}
  }

  sv-apps.sv {
    latest-packages-only = true
    parameters.rate-limiting = ${_rate_limiting}
    expected-validator-onboardings = [
      { secret = "validator-1-onboarding-secret" },
      { secret = "validator-2-onboarding-secret" },
      { secret = "validator-3-onboarding-secret" }
    ]
    scan {
      public-url = "http://localhost:10012"
      internal-url = "http://localhost:10012"
    }
    local-synchronizer-nodes.current {
      sequencer {
        admin-api {
          address = canton
          port = 10009
        }
        internal-api {
          address = canton
          port = 10008
        }
        external-public-api-url = "http://canton:10008"
      }
      mediator.admin-api {
        address = canton
        port = 10007
      }
    }

    storage = ${_storage} {
      config.properties {
        databaseName = sv
        currentSchema = sv
      }
    }

    admin-api = {
      address = "0.0.0.0"
      port = 10014
    }
    participant-client = ${_sv_participant_client}

    domains {
      global {
        alias = "global"
      }
    }

    onboarding = {
      type = found-dso
      name = sv
      first-sv-reward-weight-bps = 10000
      is-dev-net = true
    }

    contact-point = ""
    canton-identifier-config = {
      participant = sv
      sequencer = sv
      mediator = sv
    }

    splice-instance-names = ${_splice-instance-names}
    auth = ${_sv_auth}
    ledger-api-user = "service-account-sv-validator"
    validator-ledger-api-user = "service-account-sv-validator"
  }
}

_alice_participant_client {
  admin-api {
    address = canton
    port = 10102
  }
  ledger-api {
    client-config {
      address = canton
      port = 10101
    }
    auth-config {
      type = "client-credentials"
      well-known-config-url = "http://keycloak:8080/realms/Alice/.well-known/openid-configuration"
      client-id = "alice-validator"
      client-secret = "alice-validator-secret"
      audience = "https://canton.network.global"
    }
  }
}

_alice_auth = {
  algorithm = "rs-256"
  audience = "https://canton.network.global"
  jwks-url = "http://keycloak:8080/realms/Alice/protocol/openid-connect/certs"
}

canton.validator-apps.alice-validator_backend = ${_validator_backend} {
  onboarding.secret = "validator-1-onboarding-secret"
  storage.config.properties.databaseName = "validator-alice"
  admin-api.port = 10103
  participant-client = ${_alice_participant_client}
  validator-party-hint = "localnet-alice-1"
  scan-client.seed-urls.0 = "http://localhost:10012"
  onboarding.sv-client.admin-api.url = "http://localhost:10014"
  auth = ${_alice_auth}
  ledger-api-user = "service-account-alice-validator"
  validator-wallet-users = ["alice-wallet-admin"]

  # NOTE: target-throughput=0 (the default) disables the auto-topup automation
  # AND bypasses Splice's "reserved traffic" precondition check on every
  # synchronizer-routed Daml command. With target-throughput>0, every on-ledger
  # operation (party allocation, wallet onboarding, transfers) requires the
  # validator to hold >=200_000 bytes of purchased extra traffic — which is
  # impossible on a fresh LocalNet because the validator wallet has 0 amulets
  # to buy traffic with, and there is no upstream auto-tap. For LocalNet/dev
  # we use the unmetered free-tier sequencer traffic; topup is a feature for
  # production deployments where amulets actually have value.
  # See: splice/apps/validator/src/main/scala/.../ValidatorAppConfig.scala
  #      reservedTrafficO returns None when targetThroughput<=0.
  domains.global.buy-extra-traffic {
    min-topup-interval = 1m
    target-throughput = 0
  }
}


name: Integration

# The full integration suite on every tested Splice release, one job per integration group
# (test/integration/groups.ts) per release: each job starts the group's shared LocalNets once and
# runs its files (test/integration/run_group.ts). publish.yml calls it as the release gate, which
# passes only if every job passes; run it by hand from the Actions tab against any branch.

'on':
  workflow_call:
  workflow_dispatch:
  # DROP BEFORE HANDOVER: hosted measurement runs for this branch only.
  push:
    branches: [work/suite-speed]

permissions:
  contents: read

jobs:
  # Every test file in test/integration/ must be in exactly one group of
  # test/integration/groups.ts, and the matrix below must run exactly those groups. A file that is
  # missing, in two groups, or listed but gone, and a group the matrix misses or does not know,
  # fails here by name, so a rename cannot silently drop a test from the gate.
  groups:
    name: Test groups cover every file once
    runs-on: ubuntu-24.04
    steps:
      # @v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # @v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Check test/integration/groups.ts against test/integration/ and this matrix
        run: |
          deno eval --quiet '
            import { parse } from "jsr:@std/yaml@1";
            import { GROUPS } from "./test/integration/groups.ts";
            const wf = parse(await Deno.readTextFile(".github/workflows/integration.yml"));
            const matrix = wf.jobs.integration.strategy.matrix.group;
            const seen = new Map();
            for (const [name, g] of Object.entries(GROUPS)) {
              for (const f of g.files) {
                const path = `test/integration/${f}`;
                seen.set(path, [...(seen.get(path) ?? []), name]);
              }
            }
            const files = [];
            for await (const e of Deno.readDir("test/integration")) {
              if (e.isFile && e.name.endsWith("_test.ts")) files.push(`test/integration/${e.name}`);
            }
            const problems = [];
            for (const f of files.sort()) {
              const in_ = seen.get(f) ?? [];
              if (in_.length === 0) problems.push(`${f} is in no group`);
              if (in_.length > 1) problems.push(`${f} is in groups ${in_.join(", ")}`);
            }
            for (const f of seen.keys()) {
              if (!files.includes(f)) problems.push(`${f} is listed but is not a test file in test/integration/`);
            }
            for (const g of Object.keys(GROUPS)) {
              if (!matrix.includes(g)) problems.push(`group ${g} is in groups.ts but not in the matrix`);
            }
            for (const g of matrix) {
              if (!(g in GROUPS)) problems.push(`group ${g} is in the matrix but not in groups.ts`);
            }
            for (const p of problems) console.log(`::error::${p}`);
            console.log(`${files.length} test files, ${matrix.length} groups${problems.length ? `, ${problems.length} problems` : ", each file in exactly one"}`);
            if (problems.length) Deno.exit(1);
          '

  integration:
    name: Integration (Splice ${{ matrix.splice }}, group ${{ matrix.group }})
    needs: [groups]
    # Pinned: ubuntu-latest became 26.04, where Playwright 1.57.0 cannot install Chromium.
    runs-on: ubuntu-24.04
    # Each group starts at most two LocalNets, one after the other; the longest took about 9
    # minutes on a 4-vCPU runner, including the image pulls (run 44849076439).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        splice: ['0.9.4', '0.10.2']
        group: [s1, s2, init, skip, packages, packages-config, e2e, lifecycle, localnet]
    env:
      DNM_TEST_SPLICE_VERSION: ${{ matrix.splice }}

    steps:
      # @v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # @v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        name: Setup Deno
        with:
          deno-version: v2.9.3

      - name: Install Dependencies (frozen lockfile)
        run: deno install --frozen

      # The browser tests drive the runner image's Google Chrome (test/integration/browser.ts), so
      # no browser is installed. Shown here so the version is in the log.
      - name: Google Chrome
        run: google-chrome --version

      # splice_version_test.ts starts a LocalNet and checks that it runs the selected release; it
      # is in group s1. Every job first checks, without a LocalNet, that the images its own
      # LocalNets would run are at this matrix entry's release (--expect-splice).
      - name: Integration group ${{ matrix.group }} (Splice ${{ matrix.splice }})
        run: >-
          deno task test:group ${{ matrix.group }} --expect-splice=${{ matrix.splice }}
          --junit-path=junit-${{ matrix.group }}.xml

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p container-logs
          docker ps -a > container-logs/docker-ps.txt
          for id in $(docker ps -aq); do
            name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
            docker logs --timestamps "$id" > "container-logs/$name.log" 2>&1 ||
              echo "docker logs $name failed with exit $?" >> container-logs/docker-ps.txt
          done
          df -h / >> container-logs/docker-ps.txt

      # @v4.3.3
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        name: Upload test reports and container logs
        if: always()
        with:
          name: integration-splice-${{ matrix.splice }}-group-${{ matrix.group }}
          path: |
            junit-*.xml
            container-logs/
          if-no-files-found: warn

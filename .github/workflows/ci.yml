name: CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fast checks for every push and pull request. The full integration suite, which starts real
# LocalNets on every tested Splice release, is the release gate in publish.yml (integration.yml).

jobs:
  lint-and-test:
    name: Lint And Unit Test
    runs-on: ubuntu-latest

    steps:
      # @v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # @v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        name: Setup Deno
        with:
          deno-version: v2.9.3

      # @v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        name: Cache Deno Dependencies
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install Dependencies (frozen lockfile)
        run: |
          set -euo pipefail
          deno install --frozen
          git diff --exit-code deno.lock

      - name: Format Check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Check Types
        run: |
          set -euo pipefail
          deno task check
          deno check test/

      - name: Splice Version Selection Tests
        run: >-
          deno test --allow-all test/unit/splice_version_test.ts
          test/unit/integration_splice_version_test.ts test/unit/integration_config_guard_test.ts

      - name: Unit Tests
        run: deno task test:unit

      - name: Smoke Tests
        run: deno task test:smoke

      - name: Shellcheck
        run: shellcheck install.sh scripts/install-smoke.sh

  # The npm build publish.yml runs, without publishing. dnt type-checks the package it generates,
  # which deno task check does not, so a change that breaks it fails on its pull request instead of
  # after the release gate. Same Deno and Node as the publish job, on a pinned runner image.
  npm-build:
    name: Build npm Package (no publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # @v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # @v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        name: Setup Deno
        with:
          deno-version: v2.9.3

      # @v4.0.2
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        name: Setup Node.js
        with:
          node-version: '24'

      - name: Build npm package
        run: deno run --allow-all scripts/build_npm.ts "$(jq -r '.version' deno.json)"

      - name: Inspect npm package
        working-directory: npm
        run: npm pack --dry-run

  install-smoke:
    name: Install Script In A Clean Container
    runs-on: ubuntu-latest

    steps:
      # @v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # @v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        name: Setup Deno
        with:
          deno-version: v2.9.3

      # The archive and SHA256SUMS layout publish.yml releases, installed by install.sh through
      # DNM_BASE_URL in a fresh ubuntu:24.04 container. The unstamped binary reports
      # src/cli/version.ts, so this also fails if that and deno.json disagree.
      - name: Compile and archive linux/x64
        run: |
          set -euo pipefail
          mkdir dist
          deno compile --allow-all --frozen --target x86_64-unknown-linux-gnu --output dist/dnm src/cli/mod.ts
          tar -czf dist/dnm-linux-x64.tar.gz -C dist dnm
          rm dist/dnm
          (cd dist && sha256sum dnm-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Install with install.sh and run dnm
        run: scripts/install-smoke.sh dist "$(jq -r '.version' deno.json)"
